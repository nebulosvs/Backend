spring.application.name=xyz-bff

# ============================================================
# SERVIDOR BFF
# ============================================================

server.port=8443

server.ssl.enabled=true
server.ssl.key-store=classpath:bff-keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bff

# ============================================================
# BACKEND
# ============================================================

# El BFF consume el backend a través del API Gateway.
bank.backend.base-url=http://localhost:8080

# ============================================================
# OAUTH2 - CLIENTE WEB
# ============================================================

spring.security.oauth2.client.registration.web.provider=bank-auth
spring.security.oauth2.client.registration.web.client-id=cliente-web
spring.security.oauth2.client.registration.web.client-secret=web-secret
spring.security.oauth2.client.registration.web.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.web.scope=cuentas.read,transacciones.read,intereses.read

# ============================================================
# OAUTH2 - CLIENTE MOBILE
# ============================================================

spring.security.oauth2.client.registration.mobile.provider=bank-auth
spring.security.oauth2.client.registration.mobile.client-id=cliente-mobile
spring.security.oauth2.client.registration.mobile.client-secret=mobile-secret
spring.security.oauth2.client.registration.mobile.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.mobile.scope=cuentas.read,transacciones.read,intereses.read

# ============================================================
# OAUTH2 - CLIENTE ATM
# ============================================================

spring.security.oauth2.client.registration.atm.provider=bank-auth
spring.security.oauth2.client.registration.atm.client-id=cliente-atm
spring.security.oauth2.client.registration.atm.client-secret=atm-secret
spring.security.oauth2.client.registration.atm.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.atm.scope=cuentas.read,retiros.write

# ============================================================
# AUTHORIZATION SERVER
# ============================================================

spring.security.oauth2.client.provider.bank-auth.token-uri=http://localhost:9000/oauth2/token